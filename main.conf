# /etc/mavlink-router/main.conf
# Reference configuration for Orange Pi Zero 3W (Allwinner A733 / sun60iw2)
#
# install.sh generates this file with your chosen device/baud/port. This copy is
# the checked-in reference — edit it and re-run install.sh, or just copy it to
# /etc/mavlink-router/main.conf and `sudo systemctl restart mavlink-router`.
#
# Flight controller wiring (40-pin header):
#   pin 8  = TXD.0 (UART0 TX)  -> flight controller RX
#   pin 10 = RXD.0 (UART0 RX)  -> flight controller TX
#   pin 6  = GND               -> flight controller GND
#
# WARNING: /dev/ttyS1 is the onboard Bluetooth HCI port on this board, not a
# free UART. Do not use it. See docs/BUILD_JOURNAL.md.

[General]
# mavlink-router serves the MAVLink stream on this TCP port.
# Point Mission Planner / QGroundControl at  tcp:<orangepi-ip>:5678
TcpServerPort=5678
ReportStats=false
MavlinkDialect=auto
#Log=/var/log/mavlink-router
#LogMode=always
#DebugLogLevel=debug

[UartEndpoint fc]
Device = /dev/ttyS0
Baud = 57600
# mavlink-router can auto-detect among several rates if you are unsure:
#Baud = 57600,115200,921600
# Most flight controller telemetry ports do not use RTS/CTS. Leave this off
# unless your FC is explicitly configured for hardware flow control.
#FlowControl = false

# --- Optional endpoints -------------------------------------------------------

# Push telemetry to a ground station at a fixed address:
#[UdpEndpoint gcs]
#Mode = Normal
#Address = 192.168.1.50
#Port = 14550

# Listen for a ground station to connect to us instead:
#[UdpEndpoint listen]
#Mode = Server
#Address = 0.0.0.0
#Port = 14550

# Forward to another machine over TCP (e.g. through an SSH tunnel):
#[TcpEndpoint remote]
#Address = 127.0.0.1
#Port = 25791
#RetryTimeout = 10
